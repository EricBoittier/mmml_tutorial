# Methyl ic-scan with PhysNet. 09_ic_scan_ml.sh replaces __CHECKPOINT__.

structure: xyz/nma.xyz
calculator: physnet
checkpoint: __CHECKPOINT__
evaluate: energy
geometry_mode: rigid
failure_policy: fail

dofs:
  - name: acetyl_methyl
    kind: dihedral
    atoms: [6, 4, 0, 1]
    start: -180
    stop: 180
    n_points: 37
  - name: n_methyl
    kind: dihedral
    atoms: [4, 6, 8, 9]
    start: -180
    stop: 180
    n_points: 37

scans:
  - name: acetyl_1d
    dofs: [acetyl_methyl]
  - name: n_methyl_1d
    dofs: [n_methyl]
