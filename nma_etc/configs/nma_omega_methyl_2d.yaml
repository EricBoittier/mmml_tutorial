# NMA ω + N-methyl — local copy (see mmml/examples/ic_scan/nma_omega_methyl_2d.yaml).

structure: xyz/nma.xyz
calculator: xtb
evaluate: energy
geometry_mode: rigid
failure_policy: fail

dofs:
  - name: omega
    kind: dihedral
    atoms: [0, 4, 6, 8]      # CL-C-N-CR
    start: -180
    stop: 180
    n_points: 13
  - name: n_methyl
    kind: dihedral
    atoms: [4, 6, 8, 9]      # C-N-CR-HR1
    start: -180
    stop: 180
    n_points: 13

scans:
  - name: omega_1d
    dofs: [omega]
  - name: n_methyl_1d
    dofs: [n_methyl]
  - name: omega_methyl_2d
    dofs: [omega, n_methyl]
