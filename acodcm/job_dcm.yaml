#restart: /mmhome/boittier/home/mmml_tutorial/acodcm/ckpts/dcm-test/dcm1-41eae5f0-bfb1-482c-a4f9-1ce618dea491

# Auto-detected from N/R when omitted
# num_atoms: 40
max_atomic_number: 35

features: 32
max_degree: 2
num_basis_functions: 32
num_iterations: 3
zbl: true
n_res: 3
cutoff: 4.0

