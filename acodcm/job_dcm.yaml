data: ./out/splits/dcm/energies_forces_dipoles_train.npz 
  #valid_data: ./out/splits/dcm/energies_forces_dipoles_valid.npz
ckpt_dir: ./ckpts/dcm-test
tag: dcm1

# Omit n_train/n_valid when valid_data is set (uses full NPZ files as-is).
n_train: 8000
n_valid: 300
seed: 42

batch_size: 25
num_epochs: 3500
  #best: true
#save: best
#save_config: "./ckpts/test"
learning_rate: 0.001
optimizer: amsgrad
energy_weight: 1000.0
forces_weight: 100.0 #52.91
dipole_weight: 1.0 #10.0  #27.21
charges_weight: 1.0
charges: true
include_electrostatics: false
#restart: /mmhome/boittier/home/mmml_tutorial/acodcm/ckpts/dcm1-c137fb42-1f65-4748-880b-8f8184a20f70
