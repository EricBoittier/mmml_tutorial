# ACO:178 certified liquid-box → JAX-MD NVT → JAX-MD NVE (handoff).
#
# Bulk acetone ≈ 0.784 g/cm³ → L ≈ 28.0 Å for 178 molecules (same cell scale as DCM:206).
#
# Prerequisites (campaign dir, e.g. mmml_tutorial/acodcm):
#   boxes/aco178/{model.psf,model.crd,box.json}   # liquid-box PASS
#   checkpoint path below points at your hybrid ckpt
#
# Setup + run (copy-paste): see comment block at bottom, or docs below.
#
# Expected NVT markers:
#   Loading certified geometry from model.psf + model.crd ...
#   Certified box: L≈28.0 Å ... from .../box.json
# NVE: skip pre-min; continue velocities from NVT handoff.

#include:
#  - /mmhome/boittier/home/mmml/mmml/cli/run/presets/base-dt0.5.yaml
#  - /mmhome/boittier/home/mmml/mmml/cli/run/presets/certified-box-handoff.yaml

defaults:
  composition: "ACO:178"
  # Edit to your hybrid checkpoint (directory or params JSON):
  checkpoint: /mmhome/boittier/home/mmml_tutorial/acodcm/ckpts/mp2_nms/mp2nms_ewald-7e15c50f-1b31-46e3-b58e-d16003c907a7
  # checkpoint: /mmhome/boittier/home/mmml/artifacts/spooky_so3lr_muon3
    #checkpoint: /mmhome/boittier/home/mmml_tutorial/acodcm/ckpts/mp2_nms/params_mp2nms_ewald_2026-07-18_05-11-35.json
    #checkpoint: /mmhome/boittier/home/mmml_tutorial/acodcm/ckpts/gfn2_nms/gfn2nms-281022e7-f83b-4548-b512-d7c38997b36f #/mmhome/boittier/home/mmml_tutorial/acodcm/ckpts/gfn2_nms/gfn2nms-517ab608-455c-4dd9-8532-c0db32fe16f6/
    # checkpoint: /mmhome/boittier/home/mmml_tutorial/acodcm/ckpts/gfn2_nms/gfn2nms-f448e34c-cca7-43f6-8b8e-f4986b9403eb 
    #checkpoint: /mmhome/boittier/home/mmml_tutorial/acodcm/ckpts/hybrid/hybrid-940b8905-5166-4b08-a33a-8bb8a711581c #/mmhome/boittier/home/mmml_tutorial/acodcm/ckpts/hybrid/hybrid-96e58a2d-3798-4463-a318-fca1b7001dc3
  seed: 22
  temperature: 250.0
  pressure: 1.0
  dt_fs: 0.5

  from_psf: boxes/aco178/model.psf
  from_crd: boxes/aco178/model.crd
  # box.json overrides; optional explicit:
  # box_size: 27.976

  mm_switch_on: 6.0
  mm_switch_width: 5.0
  ml_switch_width: 1.5
  
  include_mm: true
  mm_charge_mode: fixed

  min_intermonomer_atom_distance: 0.75
  dynamics_overlap_min_distance: 0.75
  dynamics_overlap_action: rescue

  jax_md_update_interval: 1
  jax_md_skin_distance: 0.5
  steps_per_recording: 500

  continue_velocities: true
  handoff_write_res: true
  handoff_require_cell: true
  mc_density_equalize: false
  
  # Full-box many-to-many Ewald (train lr_solver: ewald)
  mm_nonbond_mode: periodic_external
  lr_solver: ewald
  periodic_charmm_vdw: false   # Coulomb-only; matches train LJ off

campaign_output: artifacts/aco178_certified_nvt_nve

runs:
  jaxmd_nvt:
    description: "Load certified ACO box; short JAX-MD NVT thermalization"
    backend: jaxmd
    setup: pbc_nvt
    ps: 10.0
    output_dir: runs/aco178_jaxmd_nvt
    calculator_pre_minimize: true
      #pre_min_ase_order: fire-first
      #bfgs_polish_max_fmax: 0.0
    pre_min_fmax: 0.25
    pre_min_steps: 5000
    jaxmd_minimize_steps: 5000
    jaxmd_pbc_minimize_steps: 5000
    continue_velocities: false

  jaxmd_nve:
    description: "JAX-MD NVE from NVT handoff (keep velocities; skip pre-min)"
    backend: jaxmd
    setup: pbc_nve
    depends_on: jaxmd_nvt
    ps: 100.0
    output_dir: runs/aco178_jaxmd_nve
    continue_velocities: false
    handoff_pre_minimize: true
    handoff_quality_gate: false
    calculator_pre_minimize: true
    jaxmd_minimize_steps: 200
    jaxmd_pbc_minimize_steps: 2000
